name: Pip phone check-ins

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      kind:
        description: 'Send a test check-in now (leave empty for the normal check)'
        required: false
        default: ''
        type: choice
        options: ['', 'idle', 'bed', 'morning']

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/pip-checkins.mjs
        env:
          DASHBOARDS: my_dashboard,soham_dashboard
          FORCE_KIND: ${{ inputs.kind }}
